name: snapshot-equity-pe

on:
  schedule:
    - cron: '30 21 * * 1-5'  # Mon-Fri 21:30 UTC = 17:30 ET (post-close)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Snapshot today's forward P/E
        run: node scripts/snapshot-equity-pe.mjs

      - name: Commit if changed
        run: |
          git config user.name  "siberforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A core/equity/pe/snapshots core/equity/pe/data/last-refresh.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: daily equity-pe snapshot $(date -u +%F)"
            git push
          fi

      # A scheduled data pipeline that fails quietly is worse than one that
      # does not exist: the site keeps serving the last good values as if they
      # were current. GitHub's default is an email that is easy to miss, so
      # file a real issue -- it is visible, it is dated, and it stays open
      # until someone closes it.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure: ${{ github.workflow }}`;
            const body = [
              `Workflow **${{ github.workflow }}** failed on ${new Date().toISOString()}.`,
              '',
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              'While this is broken the dashboards fed by it keep showing their',
              'last successful values. The freshness banners on the affected',
              'pages measure age against the wall clock, so they will say so,',
              'but nothing will refresh until this is fixed.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              });
            }
