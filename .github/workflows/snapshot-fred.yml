name: snapshot-fred

# Every FRED series the site uses, pulled into data/fred/ as static JSON.
# Pages read these files first (lib/fred-snapshot.js) and only call the live
# /api/fred proxy for series missing here, because FRED's CDN blocks Vercel's
# shared egress IPs from time to time. Twice on weekdays (after the 8:30 ET
# releases and after the close) and once on Sunday.
on:
  schedule:
    - cron: '20 14 * * 1-5'   # 10:20 ET
    - cron: '40 22 * * 1-5'   # 18:40 ET
    - cron: '0 12 * * 0'      # Sunday
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Snapshot FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/snapshot-fred.mjs

      - name: Commit if changed
        run: |
          git config user.name  "siberforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/fred
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: FRED snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure: ${{ github.workflow }}`;
            const body = [
              `Workflow **${{ github.workflow }}** failed on ${new Date().toISOString()}.`,
              '',
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              'More than 10% of FRED series failed, or the job crashed. Pages keep',
              'serving the last good snapshot; their as-of dates will say how old.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline-failure' });
            const match = existing.data.find(i => i.title === title);
            if (match) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['pipeline-failure'] });

      - name: Close the failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure: ${{ github.workflow }}`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline-failure' });
            for (const i of existing.data.filter(i => i.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: 'Recovered: latest run succeeded.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed' });
            }
